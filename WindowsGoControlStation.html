            }
        }

        // --- CANVAS SETUP (2D, no WebGL required) ---
        if (!ctx) {
            console.error("Canvas 2D not supported!");
            statusDiv.textContent = "Error: Canvas 2D Not Supported";
            statusDiv.style.color = "var(--error)";
        }

        // Fixed internal resolution matches the ESP32 framebuffer.
        // CSS scales the canvas to fill #frameContainer; keep it crisp.
        canvas.width = DEFAULT_WIDTH;
        canvas.height = DEFAULT_HEIGHT;
        canvas.style.imageRendering = 'pixelated';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, DEFAULT_WIDTH, DEFAULT_HEIGHT);

        // --- VIDEO WORKER ---
        const blob = new Blob([document.getElementById('decoder-worker').textContent], { type: 'text/javascript' });
        videoWorker = new Worker(window.URL.createObjectURL(blob));

        function finalizeInitialSync() {
            if (!isInitialSync) return;
            isInitialSync = false;
            frameReady = true;
            if (syncTimeoutHandle) clearTimeout(syncTimeoutHandle);

            statusDiv.textContent = `Connected (800x600)`;
            statusDiv.style.color = "var(--success)";
        }

        videoWorker.onmessage = (e) => {
            const { rectX, rectY, rectW, rectH, rectPixels, runs, y, w, h, pixels, isFullFrame } = e.data;

            // Trigger sync finalization on ANY valid video packet if we haven't yet
            if (isInitialSync || !frameReady) {
                finalizeInitialSync();
            }

            if (frameReady) {
                if (rectPixels && rectW > 0 && rectH > 0) {
                    // Dirty-rect path: one putImageData per video frame.
                    ctx.putImageData(new ImageData(rectPixels, rectW, rectH), rectX, rectY);
                    frameCount++;
                } else if (runs) {
                    // Legacy multi-run path (still understood for compatibility)
                    for (const run of runs) {
                        if (run.pixels && run.w > 0 && run.h > 0) {
                            ctx.putImageData(new ImageData(run.pixels, run.w, run.h), run.videoX, run.y);
                        }
                    }
                    frameCount++;
                } else if (pixels) {
                    // Handle single-run packets (e.g. JPEG)
                    const drawX = (e.data.videoX !== undefined) ? e.data.videoX : 0;
                    ctx.putImageData(new ImageData(pixels, w, h), drawX, y);
                    frameCount++;
                }
            }
        };

        // --- AUDIO STREAMING ---
        function disconnectAudioThrottle() {
            if (appendInterval) {
                clearInterval(appendInterval);
                appendInterval = null;
            }
        }

        function connectAudio() {
            isAudioStopped = false;
            audioStreamActive = false;

            if (USE_BLOB_AUDIO) {
                // Firefox-compatible Blob Audio approach
                console.log('Initializing Blob Audio system (Firefox mode)');
                blobAudioChunks = [];
                blobPlaybackActive = true;
                audioStreamActive = true;

                disconnectAudioThrottle();
                appendInterval = setInterval(processBlobAudioQueue, 100);
                return;
            }

            // Standard MSE approach for Chrome/Edge
            if (!window.MediaSource || !MIME_CODEC) return console.log("MSE not supported");

            // CRITICAL FIX: To prevent state issues after a Stop command,
            // we effectively ignore/revoke the old MediaSource and create a FRESH one.
            if (mediaSource) {
                try {
                    if (mediaSource.readyState === 'open') {
                        mediaSource.endOfStream();
                    }
                } catch (e) { /* Ignore errors on old MS */ }
            }

            // Create a brand new MediaSource instance
            mediaSource = new MediaSource();
            audioPlayer.src = URL.createObjectURL(mediaSource);

            mediaSource.onsourceopen = () => {
                try {
                    // Create new source buffer
                    sourceBuffer = mediaSource.addSourceBuffer(MIME_CODEC);
                    sourceBuffer.mode = 'sequence';
                    sourceBuffer.onupdateend = () => {
                        // Auto-play logic
                        if (audioPlayer.paused && !isAudioStopped && audioStreamActive) {
                            const buffered = sourceBuffer.buffered;
                            if (buffered.length > 0) {
                                const bufferAhead = buffered.end(buffered.length - 1) - audioPlayer.currentTime;
                                if (bufferAhead > MIN_BUFFER_TIME) {
                                    audioPlayer.play().catch(e => console.log("Auto-play blocked:", e));
                                }
                            }
                        }
                    };

                    disconnectAudioThrottle();
                    appendInterval = setInterval(processAudioQueue, APPEND_THROTTLE_MS);
                    audioStreamActive = true;
                    console.log("Audio system initialized (MSE mode)");
                } catch (e) {
                    console.error("SourceBuffer creation failed", e);
                }
            };
        }

        // Blob Audio - Simple Single-Player Approach for Firefox
        // Collect chunks and play when threshold reached, then seamlessly transition
        let blobChunks = [];
        let currentBlobPlayer = null;
        let nextBlobPlayer = null; // Pre-buffered next segment
        let isPlayingBlob = false;
        const BLOB_INITIAL_THRESHOLD = 48000; // ~3 seconds of 128kbps for initial buffering
        const BLOB_NEXT_THRESHOLD = 32000; // Threshold to prepare next segment

        function processBlobAudioQueue() {
            if (!blobPlaybackActive || isAudioStopped) return;

            // Collect all available chunks
            while (audioQueue.length > 0) {
                blobChunks.push(audioQueue.shift());
            }

            const totalSize = blobChunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);

            // If not currently playing, check if we have enough to start
            if (!isPlayingBlob && totalSize > BLOB_INITIAL_THRESHOLD) {
                startBlobPlayback();
            }
            // If playing and we have chunks, prepare next segment
            else if (isPlayingBlob && !nextBlobPlayer && totalSize > BLOB_NEXT_THRESHOLD) {
                prepareNextBlobSegment();
            }
        }

        function startBlobPlayback() {
            if (blobChunks.length === 0) return;

            const blob = new Blob(blobChunks, { type: 'audio/mpeg' });
            blobChunks = []; // Clear for next segment

            const url = URL.createObjectURL(blob);
            currentBlobPlayer = new Audio(url);
            currentBlobPlayer.volume = 1.0;
            isPlayingBlob = true;

            currentBlobPlayer.onended = () => {
                console.log('Blob segment ended');
                URL.revokeObjectURL(url);

                // Switch to pre-buffered next player if available
                if (nextBlobPlayer) {
                    currentBlobPlayer = nextBlobPlayer;
                    nextBlobPlayer = null;
                    currentBlobPlayer.play().catch(e => console.log('Next segment play failed:', e));
                } else {
                    currentBlobPlayer = null;
                    isPlayingBlob = false;
                    // Check if more data arrived
                    if (blobChunks.length > 0 || audioQueue.length > 0) {
                        processBlobAudioQueue();
                    }
                }
            };

            currentBlobPlayer.onerror = (e) => {
                console.error('Blob error:', e);
                URL.revokeObjectURL(url);
                currentBlobPlayer = null;
                isPlayingBlob = false;
            };

            currentBlobPlayer.play().catch(e => {
                console.log('Blob play blocked:', e);
                isPlayingBlob = false;
            });
            console.log(`Playing blob (${(blob.size / 1024).toFixed(1)}KB)`);
        }

        function prepareNextBlobSegment() {
            if (blobChunks.length === 0) return;

            const blob = new Blob(blobChunks, { type: 'audio/mpeg' });
            blobChunks = []; // Clear for next segment

            const url = URL.createObjectURL(blob);
            nextBlobPlayer = new Audio(url);
            nextBlobPlayer.volume = 1.0;

            // Pre-load the audio
            nextBlobPlayer.load();

            nextBlobPlayer.onended = () => {
                URL.revokeObjectURL(url);
                if (nextBlobPlayer === currentBlobPlayer) {
                    currentBlobPlayer = null;
                    isPlayingBlob = false;
                }
                nextBlobPlayer = null;
                // Continue if more data
                if (blobChunks.length > 0 || audioQueue.length > 0) {
                    processBlobAudioQueue();
                }
            };

            console.log(`Pre-buffered next blob (${(blob.size / 1024).toFixed(1)}KB)`);
        }

        function processAudioQueue() {
            if (!sourceBuffer || sourceBuffer.updating || isAudioStopped || !audioStreamActive) return;

            const startTime = performance.now();
            while (audioQueue.length > 0 && (performance.now() - startTime) < 10) {
                try {
                    if (sourceBuffer.updating) break;
                    const audioData = audioQueue.shift();
                    sourceBuffer.appendBuffer(audioData);
                } catch (e) {
                    // Handle buffer fullness gracefully
                    if (e.name === 'QuotaExceededError') {
                        if (sourceBuffer && !sourceBuffer.updating && audioPlayer.currentTime > 5) {
                            try {
                                sourceBuffer.remove(0, audioPlayer.currentTime - 2);
                            } catch (err) {
                                console.log("Buffer removal failed:", err);
                            }
                        }
                    } else {
                        console.log("Audio append error:", e);
                        break;
                    }
                }
            }
        }

        // --- AUDIO CONTROL HANDLERS ---
        function handleAudioStop() {
            console.log("Stopping audio playback");
            isAudioStopped = true;
            audioStreamActive = false;
            blobPlaybackActive = false;

            // Stop blob audio players (Firefox)
            if (currentBlobPlayer) {
                currentBlobPlayer.pause();
                URL.revokeObjectURL(currentBlobPlayer.src);
                currentBlobPlayer = null;
            }
            if (nextBlobPlayer) {
                nextBlobPlayer.pause();
                URL.revokeObjectURL(nextBlobPlayer.src);
                nextBlobPlayer = null;
            }
            blobChunks = [];
            isPlayingBlob = false;

            // Stop MSE audio
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            // Clear the audio queue
            audioQueue.length = 0;

            // Cleanup Buffer
            if (sourceBuffer && !sourceBuffer.updating) {
                try {
                    sourceBuffer.abort();
                } catch (e) { }
            }
            disconnectAudioThrottle();
        }

        function handleAudioPause() {
            console.log("Pausing audio playback");
            audioPlayer.pause();
        }

        function handleAudioResume() {
            console.log("Resuming audio playback");
            isAudioStopped = false;
            audioStreamActive = true;

            // We do NOT clear the queue here if auto-resume triggered it, 
            // as we want to play the packet that woke us up.

            // Reinitialize audio system cleanly
            connectAudio();

            // Start playback
            setTimeout(() => {
                audioPlayer.play().catch(e => console.log("Playback resume blocked:", e));
            }, 100);
        }

        function handleAudioNextTrack() {
            console.log("Next track");
            isAudioStopped = false;
            audioStreamActive = true;
            audioQueue.length = 0;
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            connectAudio();
        }

        // --- MP4 VIDEO PLAYBACK ---
        function cleanupMP4Player() {
            if (mp4VideoElement) {
                mp4VideoElement.pause();
                mp4VideoElement.src = '';
                mp4VideoElement.remove();
                mp4VideoElement = null;
            }
            if (mp4BlobUrl) {
                URL.revokeObjectURL(mp4BlobUrl);
                mp4BlobUrl = null;
            }
            const existing = document.getElementById('mp4Overlay');
            if (existing) existing.remove();
        }

        function playMP4Blob() {
            if (mp4Chunks.length === 0) {
                console.error('No MP4 data received');
                return;
            }

            cleanupMP4Player();

            // Create blob from accumulated chunks
            const blob = new Blob(mp4Chunks, { type: 'video/mp4' });
            mp4Chunks = []; // Free memory
            mp4BlobUrl = URL.createObjectURL(blob);
            console.log(`MP4 Blob created: ${(blob.size / 1024 / 1024).toFixed(1)}MB`);

            // Calculate scale relative to the canvas inside its container
            const container = document.getElementById('frameContainer');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const scaleX = cw / frameWidth;
            const scaleY = ch / frameHeight;

            // Map ESP32 window coordinates to container-relative coordinates (with padding)
            const pad = 4;
            const vidLeft = (mp4WindowRect.x + pad) * scaleX;
            const vidTop = (mp4WindowRect.y + pad) * scaleY;
            const vidWidth = (mp4WindowRect.w - pad * 2) * scaleX;
            const vidHeight = (mp4WindowRect.h - pad * 2) * scaleY;

            // Create overlay container positioned exactly over the video player window
            const overlay = document.createElement('div');
            overlay.id = 'mp4Overlay';
            overlay.style.cssText = `
                position: absolute;
                left: ${vidLeft}px;
                top: ${vidTop}px;
                width: ${vidWidth}px;
                height: ${vidHeight}px;
                pointer-events: none;
                z-index: 100;
            `;

            // Create video element (fills the overlay, browser composites it)
            mp4VideoElement = document.createElement('video');
            mp4VideoElement.src = mp4BlobUrl;
            mp4VideoElement.style.cssText = `
                position: absolute;
                left: 0; top: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: black;
                pointer-events: auto;
            `;
            mp4VideoElement.volume = 1.0;
            mp4VideoElement.playsInline = true;

            // Create controls bar
            const controls = document.createElement('div');
            controls.style.cssText = `
                position: absolute;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                padding: 8px 16px;
                background: rgba(0, 0, 0, 0.75);
                border-radius: 8px;
                pointer-events: auto;
                z-index: 101;
            `;

            const btnStyle = `
                border: none;
                color: white;
                font-size: 16px;
                padding: 8px 18px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
            `;

            // Play button
            const playBtn = document.createElement('button');
            playBtn.textContent = '▶ Play';
            playBtn.style.cssText = btnStyle + 'background: #2196F3;';
            playBtn.onclick = () => {
                mp4VideoElement.play().catch(e => console.log('Play blocked:', e));
            };

            // Pause button
            const pauseBtn = document.createElement('button');
            pauseBtn.textContent = '⏸ Pause';
            pauseBtn.style.cssText = btnStyle + 'background: #FF9800;';
            pauseBtn.onclick = () => {
                mp4VideoElement.pause();
            };

            // Stop button
            const stopBtn = document.createElement('button');
            stopBtn.textContent = '⏹ Stop';
            stopBtn.style.cssText = btnStyle + 'background: #F44336;';
            stopBtn.onclick = () => {
                cleanupMP4Player();
            };

            controls.appendChild(playBtn);
            controls.appendChild(pauseBtn);
            controls.appendChild(stopBtn);

            // Playback progress row
            const progressRow = document.createElement('div');
            progressRow.style.cssText = `
                position: absolute;
                bottom: 52px;
                left: 50%;
                transform: translateX(-50%);
                width: 80%;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 4px 10px;
                background: rgba(0, 0, 0, 0.7);
                border-radius: 6px;
                pointer-events: auto;
                z-index: 101;
            `;

            const timeLabel = document.createElement('span');
            timeLabel.style.cssText = 'color: white; font-size: 12px; font-family: monospace; min-width: 100px; text-align: center;';
            timeLabel.textContent = '0:00 / 0:00';

            const seekBar = document.createElement('div');
            seekBar.style.cssText = 'flex:1; height:6px; background:#555; border-radius:3px; cursor:pointer; position:relative;';
            const seekFill = document.createElement('div');
            seekFill.style.cssText = 'height:100%; width:0%; background:#2196F3; border-radius:3px; transition:width 0.2s;';
            seekBar.appendChild(seekFill);

            // Click to seek
            seekBar.onclick = (ev) => {
                if (!mp4VideoElement || !mp4VideoElement.duration) return;
                const rect = seekBar.getBoundingClientRect();
                const pct = (ev.clientX - rect.left) / rect.width;
                mp4VideoElement.currentTime = pct * mp4VideoElement.duration;
            };

            const fmtTime = (s) => {
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return m + ':' + (sec < 10 ? '0' : '') + sec;
            };

            // Update progress during playback
            mp4VideoElement.ontimeupdate = () => {
                const cur = mp4VideoElement.currentTime || 0;
                const dur = mp4VideoElement.duration || 0;
                if (dur > 0) {
                    seekFill.style.width = ((cur / dur) * 100) + '%';
                    timeLabel.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
                }
            };

            mp4VideoElement.onplay = () => {
                console.log('MP4 playback started');
                const pEl = document.getElementById('mp4Progress');
                if (pEl) pEl.remove();
            };

            mp4VideoElement.onerror = (e) => {
                const err = mp4VideoElement.error;
                console.error("Video element error:", err);
                statusDiv.textContent = "Video Error: " + (err ? err.message : "Unknown");
                statusDiv.style.color = 'var(--error)';
            };

            progressRow.appendChild(seekBar);
            progressRow.appendChild(timeLabel);

            overlay.appendChild(mp4VideoElement);
            overlay.appendChild(progressRow);
            overlay.appendChild(controls);

            if (!container) {
                console.error("frameContainer not found for overlay!");
                document.body.appendChild(overlay);
            } else {
                container.appendChild(overlay);
            }

            // Auto-play
            mp4VideoElement.play().catch(e => {
                console.log('Auto-play blocked, user must click Play:', e);
            });

            // Clean up when video ends
            mp4VideoElement.onended = () => {
                console.log('MP4 playback finished');
                cleanupMP4Player();
            };

            // Reposition on window resize
            const repositionOverlay = () => {
                const cw = container.clientWidth;
                const ch = container.clientHeight;
                const sx = cw / frameWidth;
                const sy = ch / frameHeight;
                overlay.style.left = ((mp4WindowRect.x + pad) * sx) + 'px';
                overlay.style.top = ((mp4WindowRect.y + pad) * sy) + 'px';
                overlay.style.width = ((mp4WindowRect.w - pad * 2) * sx) + 'px';
                overlay.style.height = ((mp4WindowRect.h - pad * 2) * sy) + 'px';
            };
            window.addEventListener('resize', repositionOverlay);
            mp4VideoElement._resizeHandler = repositionOverlay;
        }

        // --- FPS LOOP ---
        let fpsInterval = setInterval(() => {
            const now = performance.now();
            fpsDisplay.textContent = `FPS: ${(frameCount / ((now - lastFpsTime) / 1000)).toFixed(1)}`;
            frameCount = 0;
            lastFpsTime = now;
        }, 1000);

        // --- PING BOARD ---
        pingButton.onclick = () => {
            const ip = ipInput.value.trim();
            if (!ip) return;
            statusDiv.textContent = `Pinging ${ip}...`;
            statusDiv.style.color = '#ccc';

            const startTime = performance.now();
            const pingSocket = new WebSocket(`ws://${ip}:${WS_PORT_UI}/`);

            pingSocket.onopen = () => {
                const latency = (performance.now() - startTime).toFixed(1);
                statusDiv.textContent = `Board Online. Latency: ${latency}ms`;
                statusDiv.style.color = 'var(--success)';
                pingSocket.close();
            };

            pingSocket.onerror = () => {
                statusDiv.textContent = `Ping Failed.`;
                statusDiv.style.color = 'var(--error)';
            };
        };

        // --- MAIN CONNECTION LOGIC ---
        connectButton.onclick = () => {
            if (uiSocket) {
                if (uiSocket) uiSocket.close();
                disconnectAudioThrottle();
                handleAudioStop(); // Stop audio when disconnecting
                uiSocket = null;
                frameReady = false;
                isInitialSync = false;
                connectButton.textContent = "Connect";
                connectButton.className = "connect";
                statusDiv.textContent = "Disconnected";
                statusDiv.style.color = "#888";
                fullScreenBtn.disabled = true;
                return;
            }

            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem('esp32_ip', ip);

            initAudioContext();
            decodeShotgunSFX();
            connectAudio();

            statusDiv.textContent = "Connecting...";
            uiSocket = new WebSocket(`ws://${ip}:${WS_PORT_UI}/`); // Default root path
            uiSocket.binaryType = "arraybuffer";

            uiSocket.onopen = () => {
                statusDiv.textContent = "Connected (Syncing...)";
                connectButton.textContent = "Disconnect";
                connectButton.className = "disconnect";
                fullScreenBtn.disabled = false;

                isInitialSync = true;
                receivedSlices.fill(false);
                syncTimeoutHandle = setTimeout(finalizeInitialSync, 2000);

                // prime the File Manager on the board with the laptop folder
                wdPath = [];
                pushListing();
            };

            uiSocket.onmessage = (e) => {
                if (e.data instanceof ArrayBuffer) {
                    const data = e.data;
                    const view = new DataView(data);
                    const packetType = view.getUint8(0);

                    if (packetType === PACKET_TYPE_AUDIO) {
                        // CRITICAL FIX: AUTO-WAKEUP
                        // If we are currently "Stopped" but the board starts sending audio data,
                        // we must immediately wake up and re-initialize the audio engine.
                        if (isAudioStopped) {
                            console.log("Audio packet received while stopped. Auto-resuming...");
                            handleAudioResume();
                        }

                        // Only push to queue if we have successfully (re)activated the stream
                        if (audioStreamActive) {
                            audioQueue.push(data.slice(1));
                        }
                    } else if (packetType === PACKET_TYPE_MP4_VIDEO) {
                        const chunk = data.slice(1);
                        mp4Chunks.push(chunk);
                        mp4ReceivedSize += chunk.byteLength;

                        // 1. Try Progressive (MSE)
                        if (mp4VideoElement && mp4VideoElement._sb && !mp4VideoElement._sb.updating) {
                            try {
                                mp4VideoElement._sb.appendBuffer(chunk);
                                // Initial auto-play attempt after some data
                                if (mp4VideoElement.paused && mp4ReceivedSize > 512 * 1024) {
                                    mp4VideoElement.play().catch(() => { });
                                }
                            } catch (e) {
                                console.warn("MSE append failed, switching to buffer mode:", e);
                                mp4VideoElement._sb = null;
                            }
                        }

                        // 2. Update Beautiful Progress UI
                        const progressEl = document.getElementById('mp4Progress');
                        if (progressEl && mp4ExpectedSize > 0) {
                            const pct = Math.min(100, (mp4ReceivedSize / mp4ExpectedSize) * 100);
                            const bar = progressEl.querySelector('.bar');
                            const label = progressEl.querySelector('.label');
                            if (bar) bar.style.width = pct + '%';
                            if (label) {
                                const receivedMB = (mp4ReceivedSize / 1024 / 1024).toFixed(1);
                                const totalMB = (mp4ExpectedSize / 1024 / 1024).toFixed(1);
                                label.textContent = (mp4VideoElement && mp4VideoElement._sb)
                                    ? `Direct Stream: ${receivedMB}MB / ${totalMB}MB (${pct.toFixed(0)}%)`
                                    : `Buffering: ${receivedMB}MB / ${totalMB}MB (${pct.toFixed(0)}%)`;
                            }
                        }
                    } else if (packetType === PACKET_TYPE_VIDEO || packetType === PACKET_TYPE_RAW8 || packetType === PACKET_TYPE_JPEG_VIDEO) {
                        // Route all video packets (0x02, 0x03, 0x04) to the worker
                        const videoData = (packetType === PACKET_TYPE_JPEG_VIDEO) ? data : data.slice(1);
                        videoWorker.postMessage({ buffer: videoData, type: packetType }, [videoData]);
                    }
                } else if (typeof e.data === 'string') {
                    const cmd = e.data.trim();
                    if (cmd.startsWith("fm:")) {
                        dispatchFm(cmd);
                    } else if (cmd.startsWith("SFX:")) {
                        playSfx(cmd.substring(4));
                    } else if (cmd === "AUDIO:STOP") {
                        handleAudioStop();
                    } else if (cmd === "AUDIO:PAUSE") {
                        handleAudioPause();
                    } else if (cmd === "AUDIO:RESUME") {
                        handleAudioResume();
                    } else if (cmd === "AUDIO:NEXT" || cmd === "AUDIO:NEXT_TRACK") {
                        handleAudioNextTrack();
                    } else if (cmd.startsWith("MP4:START:")) {
                        console.log("Browser received MP4:START");
                        const parts = cmd.substring(10).split(':');
                        mp4ExpectedSize = parseInt(parts[0]) || 0;
                        if (parts.length >= 5) {
                            mp4WindowRect = {
                                x: parseInt(parts[1]) || 0, y: parseInt(parts[2]) || 0,
                                w: parseInt(parts[3]) || 320, h: parseInt(parts[4]) || 240
                            };
                        }
                        mp4ReceivedSize = 0;
                        mp4Chunks = [];
                        cleanupMP4Player();

                        if (window.MediaSource) {
                            const ms = new MediaSource();
                            mp4VideoElement = document.createElement('video');
                            mp4VideoElement.style.cssText = `width:100%; height:100%; object-fit:contain; background:black;`;
                            mp4VideoElement.playsInline = true;
                            mp4VideoElement.onplaying = () => {
                                const pEl = document.getElementById('mp4Progress');
                                if (pEl) {
                                    pEl.style.opacity = '0';
                                    setTimeout(() => { if (pEl) pEl.remove(); }, 500);
                                }
                            };
                            mp4VideoElement._ms = ms;
                            mp4VideoElement.src = URL.createObjectURL(ms);
                            ms.addEventListener('sourceopen', () => {
                                try {
                                    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
                                    sb.mode = 'sequence';
                                    mp4VideoElement._sb = sb;
                                } catch (e) { console.error("MSE error:", e); }
                            });
                        }

                        const container = document.getElementById('frameContainer');
                        if (!container) return;
                        // ESP32 Board resolution is strictly 800x600 as per user confirmation
                        const sX = container.clientWidth / (frameWidth || 800);
                        const sY = container.clientHeight / (frameHeight || 600);

                        const pDiv = document.createElement('div');
                        pDiv.id = 'mp4Progress';
                        pDiv.style.cssText = `
                            position:absolute; left:${mp4WindowRect.x * sX}px; top:${mp4WindowRect.y * sY}px;
                            width:${mp4WindowRect.w * sX}px; height:${mp4WindowRect.h * sY}px;
                            background:rgba(0,0,0,0.85); display:flex; flex-direction:column;
                            align-items:center; justify-content:center; z-index:200; color:white;
                            transition: opacity 0.5s; font-family: sans-serif;
                        `;
                        pDiv.innerHTML = `
                            <div style="font-size:16px; font-weight:bold; margin-bottom:12px;" class="label">Initializing...</div>
                            <div style="width:70%; height:6px; background:#222; border-radius:3px; overflow:hidden; border:1px solid #444">
                                <div class="bar" style="height:100%; width:0%; background:#2196F3; transition:width 0.2s"></div>
                            </div>
                        `;
                        container.appendChild(pDiv);

                        // 2. Video Overlay
                        const overlay = document.createElement('div');
                        overlay.id = 'mp4Overlay';
                        overlay.style.cssText = `
                            position:absolute; left:${mp4WindowRect.x * sX}px; top:${mp4WindowRect.y * sY}px;
                            width:${mp4WindowRect.w * sX}px; height:${mp4WindowRect.h * sY}px;
                            background:black; z-index:100; pointer-events:none; border: 1px solid #444; border-radius:4px;
                        `;
                        if (!mp4VideoElement) mp4VideoElement = document.createElement('video');
                        mp4VideoElement.style.cssText = `width:100%; height:100%; object-fit:contain;`;
                        overlay.appendChild(mp4VideoElement);
                        container.appendChild(overlay);

                        console.log(`MP4 Pipeline ready: ${(mp4ExpectedSize / 1024 / 1024).toFixed(1)}MB`);
                    } else if (cmd.startsWith("MP4:END")) {
                        console.log("Browser received MP4:END. Accumulated: " + mp4Chunks.length + " chunks");
                        // Signal end of stream if using MSE
                        if (mp4VideoElement && mp4VideoElement._ms && mp4VideoElement._ms.readyState === 'open') {
                            try { if (!mp4VideoElement._sb.updating) mp4VideoElement._ms.endOfStream(); } catch (e) { }
                        }
                        // FALLBACK: If video is NOT playing yet, create a blob and play it now
                        if (mp4VideoElement && (mp4VideoElement.paused || mp4VideoElement.currentTime === 0)) {
                            console.log("Progressive playback didn't start. Falling back to full Blob playback.");
                            const blob = new Blob(mp4Chunks, { type: 'video/mp4' });
                            mp4BlobUrl = URL.createObjectURL(blob);
                            mp4VideoElement.src = mp4BlobUrl;
                            mp4VideoElement.play().catch(e => console.log('Auto-play blocked:', e));
                        }
                        const pEl = document.getElementById('mp4Progress');
                        if (pEl) setTimeout(() => { if (pEl) pEl.style.opacity = '0'; }, 1000);
                        console.log(`MP4 transfer complete: ${(mp4ReceivedSize / 1024 / 1024).toFixed(1)}MB received`);
                    } else if (cmd.startsWith("MP4:MOVE:")) {
                        const parts = cmd.substring(9).split(':');
                        if (parts.length >= 4) {
                            mp4WindowRect = {
                                x: parseInt(parts[0]), y: parseInt(parts[1]),
                                w: parseInt(parts[2]), h: parseInt(parts[3])
                            };
                            const container = document.getElementById('frameContainer');
                            const sx = container.clientWidth / (frameWidth || 800);
                            const sy = container.clientHeight / (frameHeight || 600);
                            const overlay = document.getElementById('mp4Overlay');
                            if (overlay) {
                                overlay.style.left = (mp4WindowRect.x * sx) + 'px';
                                overlay.style.top = (mp4WindowRect.y * sy) + 'px';
                                overlay.style.width = (mp4WindowRect.w * sx) + 'px';
                                overlay.style.height = (mp4WindowRect.h * sy) + 'px';
                            }
                            const prog = document.getElementById('mp4Progress');
                            if (prog) {
                                prog.style.left = (mp4WindowRect.x * sx) + 'px';
                                prog.style.top = (mp4WindowRect.y * sy) + 'px';
                                prog.style.width = (mp4WindowRect.w * sx) + 'px';
                                prog.style.height = (mp4WindowRect.h * sy) + 'px';
                            }
                        }
                    } else if (cmd === "MP4:PLAY") {
                        console.log("Remote PLAY command received");
                        if (mp4VideoElement) mp4VideoElement.play().catch(e => console.log('Remote play blocked:', e));
                    } else if (cmd === "MP4:PAUSE") {
                        console.log("Remote PAUSE command received");
                        if (mp4VideoElement) mp4VideoElement.pause();
                    } else if (cmd === "MP4:STOP" || cmd === "MP4:CLOSE" || cmd === "MP4:HIDE") {
                        console.log(`Remote ${cmd} command received`);
                        cleanupMP4Player();
                    }
                    // --- WEB PLAYER COMMANDS ---
                    else if (cmd.startsWith("YT:PLAY:")) {
                        const parts = cmd.substring(8).split(':');
                        let url = parts[0];
                        if (parts.length > 5) {
                            url = parts.slice(0, parts.length - 4).join(':');
                        }

                        const rectParts = parts.slice(-4);
                        ytWindowRect = {
                            x: parseInt(rectParts[0]) || 0, y: parseInt(rectParts[1]) || 0,
                            w: parseInt(rectParts[2]) || 336, h: parseInt(rectParts[3]) || 200
                        };

                        currentSiteType = detectSiteType(url);
                        console.log('WebPlayer Navigating to: ' + url + ' (type: ' + currentSiteType + ')', ytWindowRect);
                        cleanupYTPlayer();
                        currentSiteType = detectSiteType(url); // Re-set after cleanup

                        const container = document.getElementById('frameContainer');
                        if (!container) {
                            console.error('CRITICAL: frameContainer not found!');
                            return;
                        }

                        const sx = container.clientWidth / (frameWidth || 800);
                        const sy = container.clientHeight / (frameHeight || 600);

                        ytOverlay = document.createElement('div');
                        ytOverlay.id = 'ytOverlay';
                        ytOverlay.style.cssText = `
                            position: absolute;
                            left: ${ytWindowRect.x * sx}px;
                            top: ${ytWindowRect.y * sy}px;
                            width: ${ytWindowRect.w * sx}px;
                            height: ${ytWindowRect.h * sy}px;
                            z-index: 2000;
                            background: black;
                            border: 1px solid #333;
                            border-radius: 4px;
                            overflow: hidden;
                            pointer-events: auto;
                        `;

                        ytIframe = document.createElement('iframe');
                        ytIframe.id = 'browserIframe';
                        ytIframe.style.cssText = 'width:100%; height:100%; border:none;';
                        ytIframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                        ytIframe.allowFullscreen = true;
                        ytIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms allow-presentation');

                        const finalUrl = convertToEmbedUrl(url);
                        console.log('Final Iframe URL:', finalUrl);
                        ytIframe.src = finalUrl;

                        ytOverlay.appendChild(ytIframe);
                        container.appendChild(ytOverlay);

                    } else if (cmd === "YT:PAUSE") {
                        console.log('WebPlayer PAUSE (site: ' + currentSiteType + ')');
                        if (ytIframe && ytIframe.contentWindow) {
                            if (currentSiteType === 'youtube') {
                                ytIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                            } else {
                                // Generic: try to pause the first <video> element inside the iframe
                                try {
                                    ytIframe.contentWindow.postMessage({ action: 'pause' }, '*');
                                } catch (e) { console.log('Cross-origin pause blocked, expected for: ' + currentSiteType); }
                            }
                        }
                    } else if (cmd === "YT:RESUME") {
                        console.log('WebPlayer RESUME (site: ' + currentSiteType + ')');
                        if (ytIframe && ytIframe.contentWindow) {
                            if (currentSiteType === 'youtube') {
                                ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                            } else {
                                try {
                                    ytIframe.contentWindow.postMessage({ action: 'play' }, '*');
                                } catch (e) { console.log('Cross-origin resume blocked, expected for: ' + currentSiteType); }
                            }
                        }
                    } else if (cmd === "YT:STOP") {
                        console.log('WebPlayer STOP');
                        cleanupYTPlayer();
                    } else if (cmd.startsWith("YT:MOVE:")) {
                        const parts = cmd.substring(8).split(':');
                        if (parts.length >= 4) {
                            ytWindowRect = {
                                x: parseInt(parts[0]), y: parseInt(parts[1]),
                                w: parseInt(parts[2]), h: parseInt(parts[3])
                            };
                            const container = document.getElementById('frameContainer');
                            if (container && ytOverlay) {
                                const sx = container.clientWidth / (frameWidth || 800);
                                const sy = container.clientHeight / (frameHeight || 600);
                                ytOverlay.style.left = (ytWindowRect.x * sx) + 'px';
                                ytOverlay.style.top = (ytWindowRect.y * sy) + 'px';
                                ytOverlay.style.width = (ytWindowRect.w * sx) + 'px';
                                ytOverlay.style.height = (ytWindowRect.h * sy) + 'px';
                            }
                        }
                    }
                }
            };

            uiSocket.onclose = () => {
                connectButton.textContent = "Connect";
                connectButton.className = "connect";
                statusDiv.textContent = "Connection Lost";
                statusDiv.style.color = "var(--error)";
                uiSocket = null;
                disconnectAudioThrottle();
                handleAudioStop(); // Stop audio when connection is lost
                frameReady = false;
            };

            uiSocket.onerror = (error) => {
                console.error("WS Error", error);
                if (uiSocket) uiSocket.close();
            };
        };

        // --- INPUT HANDLING ---
        // SPECIAL KEYS MAPPING
        const SPECIAL_KEYS = {
            "ArrowUp": "ArrowUp", "ArrowDown": "ArrowDown", "ArrowLeft": "ArrowLeft", "ArrowRight": "ArrowRight",
            "Enter": "Enter", "Space": "Space", "Escape": "Esc", "Backspace": "Backspace", "Tab": "Tab",
            "Delete": "Delete", "Home": "Home", "End": "End", "Insert": "Ins",
        };

        function sendInput(msg) {
            if (uiSocket && uiSocket.readyState === WebSocket.OPEN) uiSocket.send(msg);
        }

        // UTF-8-safe base64 helpers matching the board's wire format
        function b64FromStr(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }

        function strFromB64(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        // byte-preserving base64 (file content): no text re-encode
        function b64FromBytes(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }

        function bytesFromB64(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        // absolute display path for the File Manager's path bar
        function wdAbs(segs) {
            return '/' + segs.join('/');
        }

        // ---------- WEBDRIVE BRIDGE (board File Manager <-> Native Browser) ----------
        let rootDirHandle = null;
        let wdPath = [];   // current directory segments (relative to rootDirHandle)
        let lastViewedSize = 0;   // total size of the file in the editor
        let uploadWritable = null; // open FileSystemWritableFileStream (chunked upload)

        // Helper: get directory handle for current path
        async function getDirHandle(create = false) {
            let handle = rootDirHandle;
            for (const segment of wdPath) {
                handle = await handle.getDirectoryHandle(segment, { create });
            }
            return handle;
        }

        async function wdList() {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            const items = [];
            for await (const entry of dir.values()) {
                const info = { name: entry.name, dir: entry.kind === 'directory' };
                if (!info.dir) {
                    const file = await entry.getFile();
                    info.size = file.size;
                } else {
                    info.size = 0;
                }
                items.push(info);
            }
            items.sort((a, b) => (a.dir === b.dir) ? a.name.localeCompare(b.name) : (a.dir ? -1 : 1));
            return { items, path: wdPath.length ? wdPath[wdPath.length - 1] : "/" };
        }

        // Read up to maxBytes of a file as raw bytes (editor only needs the first
        // chunk; reading the whole file would freeze the tab on large files).
        // Returns { bytes, size } - size is the file's total length so the caller
        // can refuse to write back a truncated oversized file.
        async function wdReadBytes(name, maxBytes) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            const fileHandle = await dir.getFileHandle(name);
            const file = await fileHandle.getFile();
            const bytes = new Uint8Array(await file.slice(0, maxBytes).arrayBuffer());
            return { bytes, size: file.size };
        }

        async function wdWrite(name, content) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            const fileHandle = await dir.getFileHandle(name, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
        }

        async function wdMkdir(name) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            await dir.getDirectoryHandle(name, { create: true });
        }

        async function wdRm(name) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            await dir.removeEntry(name, { recursive: true });
        }

        async function wdRename(oldn, newn) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const dir = await getDirHandle();
            const fileHandle = await dir.getFileHandle(oldn);
            await fileHandle.move(newn);
        }

        // ---- absolute-path helpers (same-drive paste / cross-drive download) ----

        // Resolve an absolute webdrive path ("/dir/file.txt") to a file handle.
        async function getFileAbs(absPath, create) {
            const segs = absPath.split('/').filter(s => s.length);
            if (!segs.length) throw new Error('bad path: ' + absPath);
            let dir = rootDirHandle;
            for (let i = 0; i < segs.length - 1; i++)
                dir = await dir.getDirectoryHandle(segs[i], { create });
            return dir.getFileHandle(segs[segs.length - 1], { create });
        }

        // Read up to maxBytes of a file given an absolute path.
        async function wdReadAbsBytes(absPath, maxBytes) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const fh = await getFileAbs(absPath, false);
            const file = await fh.getFile();
            const bytes = new Uint8Array(await file.slice(0, maxBytes).arrayBuffer());
            return { bytes, size: file.size };
        }

        // Delete a file given an absolute path.
        async function wdRmAbs(absPath) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const segs = absPath.split('/').filter(s => s.length);
            if (!segs.length) throw new Error('bad path: ' + absPath);
            let dir = rootDirHandle;
            for (let i = 0; i < segs.length - 1; i++)
                dir = await dir.getDirectoryHandle(segs[i], { create: false });
            await dir.removeEntry(segs[segs.length - 1]);
        }

        // Copy a file between two absolute paths (board-side same-drive paste).
        async function wdCopyAbs(srcAbs, dstAbs) {
            if (!rootDirHandle) throw new Error("No folder selected");
            const fh = await getFileAbs(srcAbs, false);
            const file = await fh.getFile();
            const bytes = new Uint8Array(await file.arrayBuffer());
            const dfh = await getFileAbs(dstAbs, true);
            const w = await dfh.createWritable();
            await w.write(bytes);
            await w.close();
        }

        // push the current directory to the board's File Manager as fl: frames
        async function pushListing() {
            if (!uiSocket || uiSocket.readyState !== WebSocket.OPEN) return;
            let data;
            try {
                data = await wdList();
            } catch (err) {
                sendInput('fl:begin');
                sendInput('fl:path:' + b64FromStr(wdAbs(wdPath)));
                sendInput('fl:item:1:0:' + b64FromStr('..'));
                sendInput('fl:err:' + b64FromStr('webdrive: ' + err.message));
                return;
            }
            sendInput('fl:begin');
            sendInput('fl:path:' + b64FromStr(wdAbs(wdPath)));
            for (const it of data.items) {
                sendInput(`fl:item:${it.dir ? '1' : '0'}:${it.size}:${b64FromStr(it.name)}`);
            }
            sendInput('fl:status:' + b64FromStr(`${data.items.length} item(s)`));
        }

        // Serialise fm: handling: frames arrive in order but handleFm is async,
        // so the chunked upload (uwrite -> many uchunk -> uend) would otherwise
        // race and drop chunks before the writable stream is opened.
        let fmChain = Promise.resolve();
        function dispatchFm(cmd) {
            fmChain = fmChain.then(() => handleFm(cmd)).catch(err => {
                console.warn('fm handler error:', err);
            });
        }

        async function handleFm(cmd) {
            const parts = cmd.split(':');
            const verb = parts[1];
            try {
                switch (verb) {                    case 'root':
                        wdPath = [];
                        await pushListing();
                        break;
                    case 'up':
                        wdPath.pop();
                        await pushListing();
                        break;
                    case 'list':
                        await pushListing();
                        break;
                    case 'open':
                        wdPath.push(strFromB64(parts[2]));
                        await pushListing();
                        break;
                    case 'dl': {
                        // board wants a file streamed to C: (paste to the local
                        // drive). Stream it in chunks with small delay for pacing.
                        const p = strFromB64(parts[2]);
                        const fh = await getFileAbs(p, false);
                        const file = await fh.getFile();
                        const CH = 3072;
                        for (let off = 0; off < file.size; off += CH) {
                            const bytes = new Uint8Array(await file.slice(off, off + CH).arrayBuffer());
                            sendInput('fl:content:' + b64FromBytes(bytes));
                            await new Promise(r => setTimeout(r, 10)); // pacing delay to prevent socket/stack flooding
                        }
                        sendInput('fl:dlend');
                        break;
                    }
                    case 'uwrite': {
                        // board starts a chunked upload (C: -> Network)
                        const name = strFromB64(parts[2]);
                        const fh = await getDirHandle().getFileHandle(name, { create: true });
                        uploadWritable = await fh.createWritable();
                        break;
                    }
                    case 'uchunk':
                        if (uploadWritable) await uploadWritable.write(bytesFromB64(parts[2]));
                        break;
                    case 'uend':
                        if (uploadWritable) { await uploadWritable.close(); uploadWritable = null; }
                        await pushListing();
                        sendInput('fl:status:' + b64FromStr('saved'));
                        break;
                    case 'cp': {
                        // board-side same-drive copy (Network -> Network)
                        await wdCopyAbs(strFromB64(parts[2]), strFromB64(parts[3]));
                        await pushListing();
                        sendInput('fl:status:' + b64FromStr('copied'));
                        break;
                    }
                    case 'mv': {
                        // board-side same-drive move (Network -> Network)
                        await wdCopyAbs(strFromB64(parts[2]), strFromB64(parts[3]));
                        await wdRmAbs(strFromB64(parts[2]));
                        await pushListing();
                        sendInput('fl:status:' + b64FromStr('moved'));
                        break;
                    }
                    case 'write': {
                        // board uploads a C: file into the shared folder
                        const name = strFromB64(parts[2]);
                        await wdWrite(name, bytesFromB64(parts[3]));
                        await pushListing();
                        sendInput('fl:status:' + b64FromStr('saved ' + name));
                        break;
                    }
                    case 'view': {
                        const name = strFromB64(parts[2]);
                        const { bytes, size } = await wdReadBytes(name, 3072);
                        lastViewedSize = size;
                        sendInput('fl:content:' + b64FromBytes(bytes));
                        break;
                    }
                    case 'wview': {
                        // Blue Write document load (no editor-side lastViewedSize side effect)
                        const name = strFromB64(parts[2]);
                        const { bytes, size } = await wdReadBytes(name, 3072);
                        if (size > 3072) {
                            sendInput('fl:err:' + b64FromStr(
                                'file too large for Network drive (max 3KB): ' + size + ' bytes'));
                        } else {
                            sendInput('fl:dcontent:' + b64FromBytes(bytes));
                        }
                        break;
                    }
                    case 'wsave': {
                        // Blue Write document save (no editor truncation guard)
                        const name = strFromB64(parts[2]);
                        await wdWrite(name, bytesFromB64(parts[3]));
                        sendInput('fl:status:' + b64FromStr('saved ' + name));
                        await pushListing();
                        break;
                    }
                    case 'save': {
                        const name = strFromB64(parts[2]);
                        if (lastViewedSize > 3072) {
                            // The board editor holds only 3072 bytes; writing back
                            // would silently truncate the file.
                            sendInput('fl:err:' + b64FromStr(
                                'file too large for editor (' + lastViewedSize + ' bytes); save refused'));
                            break;
                        }
                        await wdWrite(name, bytesFromB64(parts[3]));
                        sendInput('fl:status:' + b64FromStr('saved ' + name));
                        await pushListing();
                        break;
                    }
                    case 'del': {
                        // name (relative to current dir) or an absolute path
                        // (used for the cross-drive cut cleanup)
                        const p = strFromB64(parts[2]);
                        if (p.startsWith('/')) await wdRmAbs(p);
                        else await wdRm(p);
                        await pushListing();
                        break;
                    }
                    case 'ren':
                        await wdRename(strFromB64(parts[2]), strFromB64(parts[3]));
                        await pushListing();
                        break;
                    case 'newdir':
                        await wdMkdir(strFromB64(parts[2]));
                        await pushListing();
                        break;
                    case 'newfile':
                        await wdWrite(strFromB64(parts[2]), '');
                        await pushListing();
                        break;
                }
            } catch (err) {
                sendInput('fl:err:' + b64FromStr(err.message));
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!uiSocket) return;
            // Allow OS key-repeat for the arrow keys so holding Left/Right in
            // Arkanoid keeps moving the paddle; other keys stay single-shot.
            if (e.repeat) {
                const rk = SPECIAL_KEYS[e.code] || SPECIAL_KEYS[e.key];
                if (rk !== "ArrowLeft" && rk !== "ArrowRight" &&
                    rk !== "ArrowUp" && rk !== "ArrowDown") return;
            }
            let k = SPECIAL_KEYS[e.code] || SPECIAL_KEYS[e.key] || (e.key.length === 1 ? e.key : null);

            if (k) {
                // Prevent scrolling with arrows/space
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(k)) {
                    e.preventDefault();
                }

                // Shift+arrow (etc.) extends the Blue Write text selection
                if (e.shiftKey && !(k.length === 1)) k = 'Shift+' + k;

                sendInput(k.length === 1 ? `keyb:char:${k}` : `keyb:key:${k}`);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!uiSocket) return;
            const k = SPECIAL_KEYS[e.code] || SPECIAL_KEYS[e.key];
            if (k) sendInput(`keyb:keyup:${k}`);
        });

        const frameEl = document.getElementById('frameContainer');
        frameEl.onmousedown = (e) => sendMouse('down', e);
        frameEl.onmouseup = (e) => sendMouse('up', e);
        frameEl.onmousemove = (e) => { if (e.buttons === 1) sendMouse('move', e); };

        // ADDED: Mouse wheel event listener
        frameEl.addEventListener('wheel', (e) => handleMouseWheel(e), { passive: false });

        let lastMouseTime = 0;
        function sendMouse(type, e) {
            const now = performance.now();
            if (type === 'move' && (now - lastMouseTime < MOUSE_THROTTLE_MS)) return;
            if (type === 'move') lastMouseTime = now;

            const r = canvas.getBoundingClientRect();
            // Use dynamic frameWidth/frameHeight
            const x = Math.floor((e.clientX - r.left) * (frameWidth / r.width));
            const y = Math.floor((e.clientY - r.top) * (frameHeight / r.height));
            if (x >= 0 && x < frameWidth && y >= 0 && y < frameHeight) sendInput(`mouse:${type}:${x},${y}`);
        }

        // ADDED: Mouse wheel handler function
        function handleMouseWheel(e) {
            e.preventDefault(); // Prevent page scrolling

            const now = performance.now();
            if (now - lastWheelSendTime < WHEEL_THROTTLE_MS) return;
            lastWheelSendTime = now;

            const r = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - r.left) * (frameWidth / r.width));
            const y = Math.floor((e.clientY - r.top) * (frameHeight / r.height));

            // Normalize wheel delta across browsers
            // Most browsers: e.deltaY negative = scroll up, positive = scroll down
            // We'll send -1 for up, 1 for down (or larger values for faster scrolling)
            let delta = 0;

            if (e.deltaMode === 0) {
                // Pixels mode (standard for most mice)
                delta = Math.sign(e.deltaY) * -1; // Invert for natural scrolling
            } else if (e.deltaMode === 1) {
                // Lines mode
                delta = Math.sign(e.deltaY) * -1;
            } else {
                // Pages mode (rare)
                delta = Math.sign(e.deltaY) * -3;
            }

            // Clamp delta to reasonable values (-3 to 3)
            delta = Math.max(-3, Math.min(3, delta));

            // Only send if coordinates are within bounds
            if (x >= 0 && x < frameWidth && y >= 0 && y < frameHeight) {
                // Send in format: "wheel:x,y,delta"
                sendInput(`wheel:${x},${y},${delta}`);
            }
        }

        webdrvFolderButton.onclick = async () => {
            try {
                rootDirHandle = await window.showDirectoryPicker();
                statusDiv.textContent = `Sharing: ${rootDirHandle.name}`;
                statusDiv.style.color = 'var(--success)';
                wdPath = []; // Reset to root
                await pushListing();
            } catch (err) {
                if (err.name !== 'AbortError') {
                    statusDiv.textContent = `Error: ${err.message}`;
                    statusDiv.style.color = 'var(--error)';
                }
            }
        };

        fullScreenBtn.onclick = () => {
            if (!document.fullscreenElement) frameEl.requestFullscreen();
            else document.exitFullscreen();
        };

        document.addEventListener('fullscreenchange', () => {
            document.body.classList.toggle('fullscreen-mode', !!document.fullscreenElement);
        });

        const saved = localStorage.getItem('esp32_ip');
        if (saved) ipInput.value = saved;

    </script>
