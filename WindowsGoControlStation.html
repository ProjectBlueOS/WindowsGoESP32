<!DOCTYPE html>
<html>

<head>
    <title>Windows GO - Ultimate Client</title>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 25, 35, 0.7);
            --text-color: #e0faff;
            --primary: #00f2ff;
            --neon-cyan: #00f2ff;
            --neon-blue: #0077ff;
            --success: #00ffaa;
            --error: #ff3366;
            --warning: #ffcc00;
            --border: rgba(0, 242, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #101520 0%, #050505 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h2 {
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            margin-bottom: 30px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .control-panel:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }

        input[type="text"] {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.2);
            color: white;
            border-radius: 8px;
            width: 180px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 10px 24px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .connect {
            background: rgba(0, 255, 170, 0.15) !important;
            border-color: var(--success) !important;
            color: var(--success);
        }

        .disconnect {
            background: rgba(255, 51, 102, 0.15) !important;
            border-color: var(--error) !important;
            color: var(--error);
        }

        .fullscreen {
            background: rgba(0, 119, 255, 0.15) !important;
            border-color: var(--neon-blue) !important;
            color: var(--neon-blue);
        }

        .ping {
            background: rgba(255, 204, 0, 0.15) !important;
            border-color: var(--warning) !important;
            color: var(--warning);
        }

        #frameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            background-color: #000;
            overflow: hidden;
            cursor: crosshair;
            transition: all 0.5s ease;
        }

        #glCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 15px;
            font-size: 0.85em;
            letter-spacing: 1px;
            color: rgba(0, 242, 255, 0.7);
        }

        #fpsDisplay {
            color: var(--primary);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* Fullscreen overrides */
        body.fullscreen-mode .control-panel,
        body.fullscreen-mode .status-bar,
        body.fullscreen-mode h2,
        body.fullscreen-mode .info {
            display: none;
        }

        body.fullscreen-mode #frameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            margin: 0;
            z-index: 1000;
        }

        .info {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            text-align: center;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #frameContainer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 2px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.1;
        }

        .audio-hidden {
            display: none;
        }
    </style>
</head>

    <!-- VIDEO DECODER WORKER -->
    <script id="decoder-worker" type="javascript/worker">
        const WIDTH = 800;
        const HEIGHT = 600;

        // Persistent full-frame RGBA backbuffer. Stripe runs are composited in
        // here and then one dirty-rect ImageData is handed to the main thread,
        // so we never build hundreds of per-run putImageData calls.
        let back = new Uint8ClampedArray(WIDTH * HEIGHT * 4);

        // Packed RGBA32 view over the same buffer: runs are expanded with a
        // single Uint32Array.fill() (a memory fill) instead of a per-pixel
        // loop with per-byte stores, which is dramatically faster.
        let back32 = new Uint32Array(back.buffer);

        // RGB565 -> little-endian RGBA32 LUT. Built with a DataView so the
        // packed value is endian-correct regardless of host byte order.
        const rgb565Lut = new Uint32Array(65536);
        {
            const dv = new DataView(rgb565Lut.buffer);
            for (let v = 0; v < 65536; v++) {
                const r5 = (v >> 11) & 0x1F;
                const g6 = (v >> 5) & 0x3F;
                const b5 = v & 0x1F;
                const r = (r5 << 3) | (r5 >> 2);
                const g = (g6 << 2) | (g6 >> 4);
                const b = (b5 << 3) | (b5 >> 2);
                dv.setUint32(v * 4, r | (g << 8) | (b << 16) | (255 << 24), true);
            }
        }

        // Expand a single RLE run of `count` pixels starting at linear index
        // `pxIdx` inside a (runW x h) stripe into the backbuffer via packed
        // fills. A run is split into per-row segments because rows are not
        // contiguous in memory (row stride is WIDTH, run spans runW).
        function expandRun(rle, rleIdx, pxIdx, count, y, startX, runW, h) {
            const pack = rgb565Lut[(rle[rleIdx] << 8) | rle[rleIdx + 1]];
            const end = Math.min(pxIdx + count, runW * h);
            let i = pxIdx;
            const baseRow = y * WIDTH + startX;
            while (i < end) {
                const col = i - (Math.floor(i / runW) * runW);
                const row = (i - col) / runW;
                const segEnd = Math.min(end, (row + 1) * runW);
                const n = segEnd - i;
                back32.fill(pack, baseRow + row * WIDTH + col, baseRow + row * WIDTH + col + n);
                i = segEnd;
            }
        }

        self.onmessage = function(e) {
            try {
                const ab = e.data.buffer;
                const type = e.data.type || 0x02;
                if (!ab) return;

                if (type === 0x04) { // JPEG FRAME (New optimized video path)
                    // Packet layout: [0x04 type (already stripped)] [x:u16LE] [y:u16LE] [w:u16LE] [h:u16LE] [jpeg_data...]
                    if (ab.byteLength < 9) return;
                    const headerView = new DataView(ab, 1, 8);
                    const winX = headerView.getUint16(0, true);
                    const winY = headerView.getUint16(2, true);
                    const winW = headerView.getUint16(4, true);
                    const winH = headerView.getUint16(6, true);
                    
                    const jpegBlob = new Blob([ab.slice(9)], { type: 'image/jpeg' });
                    createImageBitmap(jpegBlob).then(bitmap => {
                        // Scale JPEG to fit the window
                        const canvas = new OffscreenCanvas(winW, winH);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(bitmap, 0, 0, winW, winH);
                        // getImageData gives 8-bit RGBA (Uint8ClampedArray) - exactly what putImageData needs
                        const pixels = ctx.getImageData(0, 0, winW, winH).data;
                        self.postMessage({ y: winY, w: winW, h: winH, pixels: pixels, isFullFrame: false, videoX: winX }, [pixels.buffer]);
                    }).catch(err => {
                        console.error("JPEG Decode Error:", err);
                    });
                    return;
                }

                if (ab.byteLength < 1) return;
                const view = new DataView(ab);
                const mode = view.getUint8(0);
                
                if (mode === 5) { // Batch Mode
                    if (ab.byteLength < 4) return;
                    const isFullSync = view.getUint8(1) === 1;
                    const isFrameEnd = view.getUint8(2) === 1;
                    const stripeCount = view.getUint8(3);
                    let offset = 4; // Batch header: [mode=5][isFullSync][isFrameEnd][stripeCount]

                    // Dirty-rect accumulator: union of everything decoded in
                    // this batch, expressed in backbuffer pixel coordinates.
                    let drX0 = WIDTH, drY0 = HEIGHT, drX1 = -1, drY1 = -1;
                    let anyRun = false;

                    // stripeCount is a uint8 hint only: the firmware may pack a whole
                    // 600-row frame into one message (600 wraps to 88), so parse
                    // stripes until the buffer is exhausted instead of trusting the
                    // truncated count. A stripe is y:u16 h:u16 runCount:u8 (5 bytes).
                    let stripesParsed = 0;
                    while (offset + 5 <= ab.byteLength && stripesParsed < HEIGHT) {
                        const y = view.getUint16(offset);
                        const h = view.getUint16(offset + 2);
                        const runCount = view.getUint8(offset + 4);
                        offset += 5;

                        if (h === 0 || h > HEIGHT || y >= HEIGHT) break;

                        for (let r = 0; r < runCount; r++) {
                            if (offset + 6 > ab.byteLength) break;
                            const startX = view.getUint16(offset);
                            const runW = view.getUint16(offset + 2);
                            const rleLen = view.getUint16(offset + 4);
                            offset += 6;

                            if (offset + rleLen > ab.byteLength) break;
                            const rle = new Uint8Array(ab, offset, rleLen);
                            let rleIdx = 0, pxIdx = 0;
                            const total = runW * h;
                            // RLE stores RGB565; expand straight into `back`
                            // (one packed Uint32 fill per row segment) so each
                            // stripe writes in place without a temp RGBA copy.
                            while (rleIdx < rleLen && pxIdx < total) {
                                if (rleIdx + 3 > rleLen) break;
                                const count = rle[rleIdx++];
                                expandRun(rle, rleIdx, pxIdx, count, y, startX, runW, h);
                                pxIdx += count;
                                rleIdx += 2;
                            }

                            anyRun = true;
                            if (startX < drX0) drX0 = startX;
                            if (startX + runW - 1 > drX1) drX1 = startX + runW - 1;
                            if (y < drY0) drY0 = y;
                            if (y + h - 1 > drY1) drY1 = y + h - 1;
                            offset += rleLen;
                        }
                        stripesParsed++;
                    }

                    if (anyRun) {
                        if (drX0 < 0) drX0 = 0;
                        if (drY0 < 0) drY0 = 0;
                        if (drX1 >= WIDTH) drX1 = WIDTH - 1;
                        if (drY1 >= HEIGHT) drY1 = HEIGHT - 1;
                        const rectW = drX1 - drX0 + 1;
                        const rectH = drY1 - drY0 + 1;
                        // Copy just the dirty rect out of the backbuffer and
                        // transfer it, so the main thread does ONE putImageData
                        // per frame regardless of how many stripes there were.
                        const rectPixels = new Uint8ClampedArray(rectW * rectH * 4);
                        for (let yy = 0; yy < rectH; yy++) {
                            const src = ((drY0 + yy) * WIDTH + drX0) * 4;
                            rectPixels.set(back.subarray(src, src + rectW * 4), yy * rectW * 4);
                        }
                        self.postMessage({
                            rectX: drX0, rectY: drY0, rectW: rectW, rectH: rectH,
                            rectPixels: rectPixels,
                            isFullFrame: isFullSync,
                            isFrameEnd: isFrameEnd
                        }, [rectPixels.buffer]);
                    }
                    return;
                }
            } catch (err) {
                console.error("Worker Decode Error:", err);
            }
        };
    </script>

    <script>
        // --- CONSTANTS ---
        const WS_PORT_UI = 81;
        const DEFAULT_WIDTH = 800;
        const DEFAULT_HEIGHT = 600;
        const APPEND_THROTTLE_MS = 25;
        const MOUSE_THROTTLE_MS = 30;
        const WHEEL_THROTTLE_MS = 50;
        const MIN_BUFFER_TIME = 1.5;

        // Firefox detection and codec selection
        const isFirefox = navigator.userAgent.toLowerCase().includes('firefox');

        // Check if browser supports audio/mpeg with MSE
        function getMSECodec() {
            if (!window.MediaSource) return null;
            // Test codecs in order of preference
            const codecs = ['audio/mpeg', 'audio/mp4; codecs="mp4a.40.2"'];
            for (const codec of codecs) {
                if (MediaSource.isTypeSupported(codec)) {
                    console.log(`MSE codec supported: ${codec}`);
                    return codec;
                }
            }
            return null;
        }
        const MIME_CODEC = getMSECodec();
        // Firefox reports audio/mpeg as supported but it doesn't actually work
        // Force blob audio for Firefox
        const USE_BLOB_AUDIO = isFirefox || !MIME_CODEC;
        if (USE_BLOB_AUDIO) {
            console.log(`Using Blob Audio fallback (Firefox=${isFirefox})`);
            // Show warning to Firefox users
            if (isFirefox) {
                console.warn('⚠️ Firefox audio streaming has limitations. Chrome is recommended for best audio quality.');
            }
        } else {
            console.log(`Using MSE audio (${MIME_CODEC})`);
        }

        const PACKET_TYPE_AUDIO = 0x01;
        const PACKET_TYPE_VIDEO = 0x02;
        const PACKET_TYPE_RAW8 = 0x03;
        const PACKET_TYPE_JPEG_VIDEO = 0x04;
        const PACKET_TYPE_MP4_VIDEO = 0x07;

        // --- DOM ---
        const canvas = document.getElementById('glCanvas');
        const frameContainer = document.getElementById('frameContainer');
        const ctx = canvas.getContext('2d', { alpha: false });
        const connectButton = document.getElementById('connectButton');
        const pingButton = document.getElementById('pingButton');
        const webdrvFolderButton = document.getElementById('webdrvFolderButton');
        const ipInput = document.getElementById('ipAddressInput');
        const fullScreenBtn = document.getElementById('fullscreenButton');
        const statusDiv = document.getElementById('status');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const audioPlayer = document.getElementById('audioPlayer');

        // --- STATE ---
        let uiSocket;
        let videoWorker;
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let lastMouseSendTime = 0;
        let lastWheelSendTime = 0;
        let isFullscreen = false;

        let frameWidth = DEFAULT_WIDTH;
        let frameHeight = DEFAULT_HEIGHT;
        let sliceHeight = 16; // Matches firmware SLICE_HEIGHT

        // Audio State
        let audioQueue = [];
        let mediaSource = null;
        let sourceBuffer = null;
        let appendInterval = null;
        let isAudioStopped = false;
        let audioStreamActive = false;


        // Blob Audio State (Firefox fallback)
        let blobAudioChunks = [];
        let blobAudioPlayer = null;
        let blobPlaybackActive = false;
        let blobBufferTimeout = null;

        // MP4 Video State
        let mp4Chunks = [];
        let mp4ExpectedSize = 0;
        let mp4ReceivedSize = 0;
        let mp4VideoElement = null;
        let mp4BlobUrl = null;
        let mp4WindowRect = { x: 0, y: 0, w: 320, h: 240 }; // Window coords from ESP32

        // Web Player State
        let ytOverlay = null;
        let ytIframe = null;
        let ytWindowRect = { x: 0, y: 0, w: 336, h: 200 };
        let currentSiteType = 'generic'; // 'youtube', 'bitchute', 'odysee', 'aniwatch', 'generic'

        function cleanupYTPlayer() {
            if (ytOverlay) {
                ytOverlay.remove();
                ytOverlay = null;
            }
            ytIframe = null;
            currentSiteType = 'generic';
        }

        function detectSiteType(url) {
            try {
                const u = new URL(url);
                const h = u.hostname.toLowerCase();
                if (h.includes('youtube.com') || h.includes('youtu.be')) return 'youtube';
                if (h.includes('bitchute.com')) return 'bitchute';
                if (h.includes('odysee.com')) return 'odysee';
                if (h.includes('aniwatchtv.to') || h.includes('aniwatch')) return 'aniwatch';
            } catch (e) { }
            return 'generic';
        }

        function convertToEmbedUrl(url) {
            try {
                const u = new URL(url);
                const h = u.hostname.toLowerCase();

                // YouTube: convert watch URLs to embed
                if (h.includes('youtube.com') || h.includes('youtu.be')) {
                    let videoId = '';
                    if (h.includes('youtu.be')) {
                        videoId = u.pathname.substring(1);
                    } else if (u.pathname.includes('/embed/')) {
                        return url;
                    } else {
                        videoId = u.searchParams.get('v');
                    }
                    if (videoId) {
                        return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&rel=0&modestbranding=1&enablejsapi=1`;
                    }
                }

                // BitChute: convert video URLs to embed
                if (h.includes('bitchute.com')) {
                    const match = u.pathname.match(/\/video\/([\w-]+)/);
                    if (match) {
                        return `https://www.bitchute.com/embed/${match[1]}/`;
                    }
                }

                // Odysee: convert claim URLs to embed
                if (h.includes('odysee.com')) {
                    // Odysee embed format: https://odysee.com/$/embed/claim-name/claim-id
                    const pathParts = u.pathname.split('/');
                    if (pathParts.length >= 3 && !u.pathname.includes('/$/embed/')) {
                        // Remove leading empty string from split
                        const claimPath = pathParts.filter(p => p && p !== '$').join('/');
                        return `https://odysee.com/$/embed/${claimPath}`;
                    }
                }

                // AniwatchTV: load directly (no standard embed format)
                // These sites typically work in iframes as-is
            } catch (e) {
                console.error('URL Conversion Error:', e);
            }
            return url;
        }

        // Video State
        let receivedSlices = []; // Dynamic sizing
        let isInitialSync = false;

        // Frame State
        let frameReady = false;

        let syncTimeoutHandle = null;

        // --- SFX SYSTEM ---
        let sfxCtx = null;
        function initAudioContext() {
            if (!sfxCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) sfxCtx = new AudioCtx();
            }
            if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume();
        }
        let shotgunBuffer = null;
        async function decodeShotgunSFX() {
            if (shotgunBuffer || !sfxCtx) return;
            try {
                const response = await fetch(SHOTGUN_SFX_B64);
                const arrayBuffer = await response.arrayBuffer();
                shotgunBuffer = await sfxCtx.decodeAudioData(arrayBuffer);
                console.log("Shotgun SFX decoded successfully");
            } catch (e) {
                console.error("Failed to decode shotgun SFX", e);
